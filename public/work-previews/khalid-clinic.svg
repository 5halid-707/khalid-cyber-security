<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a07"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a55a"/>
      <stop offset="50%" stop-color="#e6c885"/>
      <stop offset="100%" stop-color="#8a6d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#c9a55a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c9a55a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c9a55a" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- Decorative blobs -->
  <circle cx="1000" cy="120" r="80" fill="#c9a55a" opacity="0.1" filter="blur(20px)"/>
  <circle cx="200" cy="550" r="120" fill="#c9a55a" opacity="0.08" filter="blur(30px)"/>

  <!-- Top nav -->
  <rect x="0" y="0" width="1200" height="80" fill="#0f0a07" opacity="0.6"/>
  <g transform="translate(60, 40)">
    <rect x="0" y="-18" width="40" height="40" rx="10" fill="url(#gold)"/>
    <path d="M 12 -2 L 28 -2 L 28 4 L 22 4 L 22 8 L 18 8 L 18 4 L 12 4 Z M 14 8 L 16 8 L 16 14 L 14 14 Z M 24 8 L 26 8 L 26 14 L 24 14 Z" fill="#fff"/>
    <text x="55" y="-2" fill="#faf6f0" font-family="Cairo, sans-serif" font-size="20" font-weight="700">عيادة خالد</text>
    <text x="55" y="18" fill="#c9a55a" font-family="Poppins, sans-serif" font-size="9" font-weight="600" letter-spacing="2">MEDICAL CARE</text>
  </g>

  <!-- Nav links -->
  <g fill="#faf6f0" opacity="0.7" font-family="Cairo, sans-serif" font-size="13" font-weight="500">
    <text x="700" y="45" text-anchor="end">تواصل معنا</text>
    <text x="780" y="45" text-anchor="end">احجز موعدك</text>
    <text x="860" y="45" text-anchor="end">الأطباء</text>
    <text x="940" y="45" text-anchor="end">خدماتنا</text>
    <text x="1010" y="45" text-anchor="end">من نحن</text>
    <text x="1080" y="45" text-anchor="end">الرئيسية</text>
  </g>
  <rect x="760" y="68" width="160" height="36" rx="18" fill="url(#gold)"/>
  <text x="840" y="91" fill="#fff" font-family="Cairo, sans-serif" font-size="12" font-weight="700" text-anchor="middle">احجز موعدك الآن</text>

  <!-- Hero content -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#c9a55a" opacity="0.15" stroke="#c9a55a" stroke-opacity="0.4"/>
    <circle cx="20" cy="18" r="4" fill="#e6c885"/>
    <text x="35" y="23" fill="#e6c885" font-family="Cairo, sans-serif" font-size="13" font-weight="500">عيادة خالد الطبية</text>

    <text x="0" y="90" fill="#fff" font-family="Cairo, sans-serif" font-size="62" font-weight="800">رعاية صحية</text>
    <text x="0" y="160" fill="url(#gold)" font-family="Cairo, sans-serif" font-size="62" font-weight="800">بمعايير عالمية</text>

    <text x="0" y="220" fill="#fff" opacity="0.7" font-family="Cairo, sans-serif" font-size="17">نقدم خدمات طبية متكاملة بأحدث التقنيات وفريق</text>
    <text x="0" y="245" fill="#fff" opacity="0.7" font-family="Cairo, sans-serif" font-size="17">من أمهر الأطباء الاستشاريين لنمنحك تجربة علاجية آمنة</text>

    <!-- CTAs -->
    <rect x="0" y="290" width="220" height="56" rx="28" fill="url(#gold)"/>
    <text x="110" y="324" fill="#fff" font-family="Cairo, sans-serif" font-size="16" font-weight="700" text-anchor="middle">احجز موعدك الآن</text>

    <rect x="240" y="290" width="180" height="56" rx="28" fill="#fff" opacity="0.1" stroke="#fff" stroke-opacity="0.3"/>
    <text x="330" y="324" fill="#fff" font-family="Cairo, sans-serif" font-size="16" font-weight="700" text-anchor="middle">خدماتنا</text>

    <!-- Stats -->
    <line x1="0" y1="380" x2="500" y2="380" stroke="#fff" stroke-opacity="0.1"/>
    <g transform="translate(0, 410)">
      <text x="0" y="0" fill="url(#gold)" font-family="Poppins, sans-serif" font-size="28" font-weight="800">+25</text>
      <text x="0" y="22" fill="#fff" opacity="0.6" font-family="Cairo, sans-serif" font-size="11">سنة خبرة</text>
    </g>
    <g transform="translate(130, 410)">
      <text x="0" y="0" fill="url(#gold)" font-family="Poppins, sans-serif" font-size="28" font-weight="800">+50</text>
      <text x="0" y="22" fill="#fff" opacity="0.6" font-family="Cairo, sans-serif" font-size="11">استشاري متخصص</text>
    </g>
    <g transform="translate(280, 410)">
      <text x="0" y="0" fill="url(#gold)" font-family="Poppins, sans-serif" font-size="28" font-weight="800">+100K</text>
      <text x="0" y="22" fill="#fff" opacity="0.6" font-family="Cairo, sans-serif" font-size="11">حالة شفاء</text>
    </g>
    <g transform="translate(420, 410)">
      <text x="0" y="0" fill="url(#gold)" font-family="Poppins, sans-serif" font-size="28" font-weight="800">24/7</text>
      <text x="0" y="22" fill="#fff" opacity="0.6" font-family="Cairo, sans-serif" font-size="11">خدمة طوارئ</text>
    </g>
  </g>

  <!-- Doctor image card on right -->
  <g transform="translate(720, 140)">
    <rect x="0" y="0" width="420" height="440" rx="32" fill="#c9a55a" opacity="0.1"/>
    <rect x="20" y="20" width="380" height="400" rx="24" fill="#1a1410" stroke="#c9a55a" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Stethoscope icon -->
    <circle cx="210" cy="120" r="50" fill="url(#gold)"/>
    <path d="M 195 105 L 195 130 L 200 130 L 200 110 L 220 110 L 220 130 L 225 130 L 225 105 Z" fill="#fff"/>
    <circle cx="210" cy="150" r="6" fill="#fff"/>

    <!-- Service cards grid -->
    <g transform="translate(40, 200)">
      <rect x="0" y="0" width="100" height="80" rx="12" fill="#0f0a07" stroke="#c9a55a" stroke-opacity="0.3"/>
      <circle cx="50" cy="30" r="14" fill="#c9a55a" opacity="0.2"/>
      <path d="M 44 30 L 56 30 M 50 24 L 50 36" stroke="#c9a55a" stroke-width="2"/>
      <text x="50" y="60" fill="#faf6f0" font-family="Cairo, sans-serif" font-size="9" text-anchor="middle">أمراض القلب</text>

      <rect x="110" y="0" width="100" height="80" rx="12" fill="#0f0a07" stroke="#c9a55a" stroke-opacity="0.3"/>
      <circle cx="160" cy="30" r="14" fill="#c9a55a" opacity="0.2"/>
      <path d="M 154 30 L 166 30" stroke="#c9a55a" stroke-width="2"/>
      <text x="160" y="60" fill="#faf6f0" font-family="Cairo, sans-serif" font-size="9" text-anchor="middle">الأسنان</text>

      <rect x="220" y="0" width="100" height="80" rx="12" fill="#0f0a07" stroke="#c9a55a" stroke-opacity="0.3"/>
      <circle cx="270" cy="30" r="14" fill="#c9a55a" opacity="0.2"/>
      <circle cx="270" cy="30" r="6" fill="none" stroke="#c9a55a" stroke-width="2"/>
      <text x="270" y="60" fill="#faf6f0" font-family="Cairo, sans-serif" font-size="9" text-anchor="middle">العيون</text>
    </g>

    <g transform="translate(40, 300)">
      <rect x="0" y="0" width="100" height="80" rx="12" fill="#0f0a07" stroke="#c9a55a" stroke-opacity="0.3"/>
      <circle cx="50" cy="30" r="14" fill="#c9a55a" opacity="0.2"/>
      <path d="M 44 26 Q 50 22 56 26 L 56 34 Q 50 38 44 34 Z" fill="#c9a55a"/>
      <text x="50" y="60" fill="#faf6f0" font-family="Cairo, sans-serif" font-size="9" text-anchor="middle">الأطفال</text>

      <rect x="110" y="0" width="100" height="80" rx="12" fill="#0f0a07" stroke="#c9a55a" stroke-opacity="0.3"/>
      <circle cx="160" cy="30" r="14" fill="#c9a55a" opacity="0.2"/>
      <path d="M 154 30 L 166 30 M 160 24 L 160 36" stroke="#c9a55a" stroke-width="2"/>
      <text x="160" y="60" fill="#faf6f0" font-family="Cairo, sans-serif" font-size="9" text-anchor="middle">الأعصاب</text>

      <rect x="220" y="0" width="100" height="80" rx="12" fill="#0f0a07" stroke="#c9a55a" stroke-opacity="0.3"/>
      <circle cx="270" cy="30" r="14" fill="#c9a55a" opacity="0.2"/>
      <path d="M 264 30 L 276 30" stroke="#c9a55a" stroke-width="2"/>
      <text x="270" y="60" fill="#faf6f0" font-family="Cairo, sans-serif" font-size="9" text-anchor="middle">المختبرات</text>
    </g>
  </g>

  <!-- Floating particles -->
  <circle cx="150" cy="120" r="3" fill="#c9a55a" opacity="0.5"/>
  <circle cx="600" cy="80" r="2" fill="#c9a55a" opacity="0.4"/>
  <circle cx="900" cy="540" r="4" fill="#c9a55a" opacity="0.3"/>
  <circle cx="350" cy="600" r="2" fill="#c9a55a" opacity="0.5"/>

  <!-- Bottom indicator dots -->
  <rect x="540" y="640" width="60" height="4" rx="2" fill="#c9a55a"/>
  <rect x="610" y="640" width="20" height="4" rx="2" fill="#fff" opacity="0.3"/>
</svg>
